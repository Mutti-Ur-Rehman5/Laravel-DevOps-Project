
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-devops-app
    restart: unless-stopped
    ports:
      - "8081:80"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel_db
      DB_USERNAME: laravel_user
      DB_PASSWORD: LaravelPass123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel-network

  db:
    image: mysql:8.0
    container_name: laravel-devops-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: LaravelPass123
      MYSQL_ROOT_PASSWORD: RootPass123
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRootPass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - laravel-network

volumes:
  mysql-data:

networks:
  laravel-network:
    driver: bridge
